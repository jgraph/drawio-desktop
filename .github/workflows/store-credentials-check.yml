name: Check Microsoft Store Credentials

# Read-only check that the Partner Center credentials used by the
# microsoft-store job in electron-builder-win.yml still work. It reads the Store
# listing and touches no submission, so it is safe to run at any time.
#
# Run it:
#   - after first setting the four secrets up, before relying on a release
#   - after rotating MS_STORE_CLIENT_SECRET (Entra client secrets expire, 24
#     months maximum), to confirm the new one took
#   - when a release's microsoft-store job fails, to tell a credential problem
#     apart from a packaging or submission one

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
    - name: Check the secrets are set
      shell: powershell
      env:
        MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
        MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
        MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      run: |
        # Named up front so a missing secret reports itself, rather than surfacing
        # later as an opaque authentication failure from the CLI
        $missing = @('MS_STORE_TENANT_ID', 'MS_STORE_SELLER_ID', 'MS_STORE_CLIENT_ID', 'MS_STORE_CLIENT_SECRET') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
        if ($missing) { throw "Missing repository secret(s): $($missing -join ', ')" }
        Write-Host "All four Microsoft Store secrets are present"

    - name: Set up Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@v1.4

    - name: Configure Microsoft Store Developer CLI
      shell: powershell
      env:
        MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
        MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
        MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
        MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      run: |
        # Through the environment rather than inline ${{ }}: a client secret
        # holding a quote, backtick or $ would otherwise be re-parsed by
        # PowerShell and mangled before it ever reached the CLI
        msstore reconfigure `
          --tenantId $env:MS_STORE_TENANT_ID `
          --sellerId $env:MS_STORE_SELLER_ID `
          --clientId $env:MS_STORE_CLIENT_ID `
          --clientSecret $env:MS_STORE_CLIENT_SECRET

    - name: Read the Store listing
      shell: powershell
      run: |
        # Read-only. A successful read proves the whole chain: the Entra app
        # registration, its Manager role in Partner Center, and all four secrets.
        # 9MVVSZK43QQW is the "draw.io Diagrams" Store product ID
        # (https://apps.microsoft.com/detail/9MVVSZK43QQW).
        msstore apps get 9MVVSZK43QQW
